<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Meu Primeiro Formulário</title>
    <link rel="stylesheet" href="css/formulario.css"/>
</head>
<body>

    <h2>Formulario</h2>
    <p>Preencha os campos abaixo para testar o site!</p>

    <form action="#" method="POST">
        
        <fieldset> 
            <legend>Qual é o seu nome completo?</legend>
            <input type="text" id="nome" name="nome_usuario" placeholder="Digite seu nome aqui" oninput="contarLetras()">
            
            <p id="contador" style="font-size: 12px; color:     gray; margin-top: 5px;">0 caracteres</p>
        </fieldset>

        <fieldset>
            <legend>Qual é o seu melhor e-mail?</legend>
            <input type="text" name="email_usuario" placeholder="nome@email.com">
              <p id="contadorEmail" style="font-size: 12px; color: gray; margin-top: 5px;">0 caracteres</p>
        </fieldset>

        <fieldset>
            <legend>De qual cidade você é?</legend> 
            <input type="text" name="cidade_usuario" placeholder="Ex: São Paulo"> 
        </fieldset>

        <fieldset>
            <legend>Qual o seu nível em eletrônica?</legend> 
            <input type="radio" id="nivel1" name="nivel" value="iniciante"> 
            <label for="nivel1">Comecei hoje também</label><br>
            
            <input type="radio" id="nivel2" name="nivel" value="sabe_um_pouco">
            <label for="nivel2">Já sei ligar um LED</label>
        </fieldset>

        <fieldset>
            <legend>Quais componentes você já tem em casa?</legend>
            <input type="checkbox" id="comp1" name="componentes" value="arduino">
            <label for="comp1">Placa Arduino</label><br>
            
            <input type="checkbox" id="comp2" name="componentes" value="leds">
            <label for="comp2">Luzinhas LED</label>
        </fieldset>

        <input type="submit" value="Enviar Dados Agora!">

    </form>

    <script src="/JS/contador.js"></script>

</body>
</html>
