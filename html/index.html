    <script>
        function abrirImagemCentralizada(event, urlDaImagem) {
            // 1. Impede o navegador de abrir a imagem do jeito teimoso padrão dele
            event.preventDefault(); 
            
            // 2. Cria um código HTML invisível com as regras perfeitas de centralização para imagens 4K
            const codigoHTMLInterno = `
                <html>
                <head>
                    <style>
                        body { margin:0; padding:0; background:#ffffff; display:flex; justify-content:center; align-items:center; height:100vh; overflow:hidden; }
                        img { max-width:100%; max-height:100%; object-fit:contain; }
                    </style>
                </head>
                <body>
                    <img src="${urlDaImagem}">
                </body>
                </html>
            `;
            
            // 3. Injeta esse código diretamente para dentro da sua "janela" (iframe)
            const iframe = document.getElementById('meuIframe');
            const doc = iframe.contentDocument || iframe.contentWindow.document;
            doc.open();
            doc.write(codigoHTMLInterno);
            doc.close();
        }

        // Executa a função automaticamente assim que o site abre para centralizar a imagem de boas-vindas inicial
        window.onload = function() {
            abrirImagemCentralizada({ preventDefault: function(){} }, 'imagens/boasvindas.png');
        };
    </script>
