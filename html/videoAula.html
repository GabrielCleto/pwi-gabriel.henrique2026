
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videoaula - Arduino</title>
    <link rel="stylesheet" href="css/maps.css"/>
</head>

    <div class="container-mapa">
        <div class="topo-mapa">
            <h2>Videoaula: Introdução ao Arduino</h2>
            <p>A aula começará em instantes...</p>
        </div>
        
        <a href="videos/NOME_DO_SEU_ARQUIVO.mp4" target="_blank" class="link-video-aula">
            <video id="meuVideo" class="mapa-interativo" muted loop playsinline poster="imagens/thumbnail.png">
                <source src="videos/videoAula.mp4" type="video/mp4">
                Seu navegador não suporta a reprodução de vídeos.
            </video>
        </a>
    </div>

    <script>
        // Espera 5000 milissegundos (5 segundos) e solta o play
        setTimeout(function() {
            var video = document.getElementById("meuVideo");
            video.play();
        }, 5000);
    </script>

</body>
</html>
