<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Localização da Fábrica do Arduino</title>
    <link rel="stylesheet" href="CSS/maps.css"/>
</head>
<body>
    <!-- div = divisão ou bloco de conteúdo -->
<!-- class = nome usado para estilização no CSS -->
<!-- iframe = exibe conteúdo externo na página -->
<!-- src = endereço do conteúdo carregado -->
<!-- allowfullscreen = permite tela cheia -->
<!-- loading="lazy" = carrega o mapa apenas quando necessário -->
<!-- referrerpolicy = controla informações enviadas ao site externo -->
<!-- h2 = título de nível 2 -->
<!-- p = parágrafo -->

    <div class="container-mapa">
        <div class="topo-mapa">
            <h2>Sede e Fábrica do Arduino</h2>
            <p>Torino  — Piemonte, Itália</p>
        </div>
        
        <iframe 
            class="mapa-interativo"
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2818.2139783103444!2d7.671343776602322!3d45.06118026090715!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x47886d1360155555%3A0x6b4fb09a1ff08a62!2sArduino%20Store%20Torino!5e0!3m2!1spt-BR!2sbr!4v1710000000000!5m2!1spt-BR!2sbr" 
            allowfullscreen="" 
            loading="lazy" 
            referrerpolicy="no-referrer-when-downgrade">
        </iframe>
    </div>

</body>
</html>
